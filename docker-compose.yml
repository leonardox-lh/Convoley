services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: convoley
      POSTGRES_PASSWORD: convoley
      POSTGRES_DB: convoley
    # 5433 avoids clashing with a Postgres already installed on 5432
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convoley"]
      interval: 2s
      timeout: 5s
      retries: 15

  # S3-compatible storage for club logos (Railway Bucket in production). Accepts any credentials.
  bucket:
    image: adobe/s3mock:3.12.0
    environment:
      initialBuckets: convoley-dev
      root: /data
      retainFilesOnExit: "true"
    ports:
      - "9000:9090"
    volumes:
      - bucket-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/favicon.ico"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
  bucket-data:
